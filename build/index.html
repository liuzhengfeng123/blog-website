<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>el-tree-virtual-scroll</title>
    <script>
      const storageTheme = localStorage.getItem('theme') || 'light'
      document.documentElement.setAttribute('theme', storageTheme)
    </script>
    <style>
      body {
        background-color: #fff;
        color: #213547;
      }

      :root[theme=dark] body {
        background-color: #1a1a1a;
        color: rgba(255, 255, 255, .87);
      }
    </style>
    <!-- <link rel="stylesheet" href="https://shadow.elemecdn.com/npm/highlight.js@9.3.0/styles/color-brewer.css"> -->
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
