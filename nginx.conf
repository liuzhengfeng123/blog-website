http {

        server {
                server_name liuzhengfeng.xyz www.liuzhengfeng.xyz;
                gzip_static on;

                location / {
                        root /data/dist;
                        index index.html;
                        try_files $uri $uri/ /index.html;

                        sendfile on;
                        sendfile_max_chunk 1m;
                        tcp_nopush on;
                }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/liuzhengfeng.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/liuzhengfeng.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
        }

        server {
    if ($host = www.liuzhengfeng.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = liuzhengfeng.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

                if ($host = 106.14.18.67) {
        return 301 https://www.liuzhengfeng.xyz;
    } # managed by Certbot


                listen 80;
                server_name liuzhengfeng.xyz www.liuzhengfeng.xyz 106.14.18.67;
    return 404; # managed by Certbot
        }
}